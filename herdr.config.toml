onboarding = false
[keys]
prefix = "ctrl+;"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[ui]
hide_tab_bar_when_single_tab = true

[ui.sidebar.spaces]
rows = [
  ["workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#bac2de", bold = true, dim = false }],
  [{ token = "workspace", fg = "#a6adc8", bold = false, dim = false }, "agent"],
]

[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#bac2de", bold = true, dim = false }],
  [{ token = "workspace", fg = "#a6adc8", bold = false, dim = false }, { token = "agent", fg = "#ffffff", bold = true, dim = false }],
]
claude = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#bac2de", bold = true, dim = false }],
  [{ token = "workspace", fg = "#a6adc8", bold = false, dim = false }, { token = "agent", fg = "#de7356", bold = true, dim = false }],
]

[experimental]
switch_ascii_input_source_in_prefix = true

[[keys.command]]
key = "ctrl+shift+p"
type = "popup"
command = "$SHELL"
description = "open temporary shell popup pane"
width = "80%"
height = "80%"

[[keys.command]]
key = "ctrl+g"
type = "popup"
command = "lazygit"
description = "open Lazygit popup pain"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "~/dotfiles/scripts/herdr_worktree_from_remote_branch.sh"
description = "リモートブランチから worktree を作成"
width = "80%"
height = "80%"

[theme]
name = "solarized"
auto_switch = false
